version: 2
updates:
  # npm(pnpm-lock.yaml) 의존성 — 주간. minor/patch 는 묶어서 PR 노이즈를 줄인다.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # GitHub Actions 워크플로의 액션 버전 — 주간.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
