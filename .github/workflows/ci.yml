name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# 토큰 기본 권한 최소화 — 명시하지 않은 스코프는 none. 잡별로 필요한 만큼만 확대한다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 스펙 드리프트: 커밋된 생성물 == `pnpm gen:api` 재실행 결과인지 강제(스펙↔생성물 동기화).
      # 스펙(openapi/admin-api.yaml)이 커밋돼 있을 때만 돈다 — 없으면 스킵(생성물도 없음).
      - name: API drift check (생성물 == gen:api 재생성)
        run: |
          if [ -f openapi/admin-api.yaml ]; then
            pnpm gen:api
            git diff --exit-code -- src/shared/api/generated \
              || { echo '::error::생성물이 스펙과 어긋납니다 — pnpm gen:api 후 커밋하세요.'; exit 1; }
          else
            echo 'openapi/admin-api.yaml 미존재 — 드리프트 체크 스킵.'
          fi

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint FSD (Steiger)
        run: pnpm lint:fsd

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage threshold)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # 빌드 산출물 시크릿 스캔 — 프론트 번들(dist)은 전량 공개되므로 개인키·클라우드 키·토큰
      # 시그니처가 인라인되지 않았는지 검사한다(VITE_* 사고 등). 의존성 없는 휴리스틱, 매치 시 실패.
      - name: Scan build output for secrets
        run: |
          if grep -rIEn \
            -e 'BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
            -e 'gh[pousr]_[0-9A-Za-z]{20,}' \
            -e 'sk_live_[0-9a-zA-Z]+' \
            dist; then
            echo '::error::빌드 산출물(dist)에서 시크릿 시그니처가 발견되었습니다.'
            exit 1
          fi
          echo 'dist 시크릿 스캔 통과 — 시그니처 매치 없음.'

  # 시크릿 스캔(전체 히스토리) — 핀 고정 Docker 로 통일(gitleaks-action 의 GITLEAKS_LICENSE·
  # PR fetch 권한 의존 제거). .gitleaks.toml 의 allowlist 를 적용한다.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, 전체 히스토리)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --config=/repo/.gitleaks.toml

  # SCA — 의존성 취약점 스캔. high/critical advisory 만 빌드를 차단한다.
  sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # high/critical 만 차단, devDependency advisory(번들 미포함)는 --prod 로 제외.
      - name: pnpm audit (high+, prod)
        run: pnpm audit --prod --audit-level=high

      # OSV 교차검증 — advisory DB 다양성. 비차단(보고용). private 저장소는 GHAS 없이는 SARIF
      # 업로드가 막히므로 핀 고정 CLI(Docker)로 결과를 로그에만 남긴다.
      - name: osv-scanner (SCA 교차검증, 비차단)
        continue-on-error: true
        run: docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/google/osv-scanner:v2.3.8 scan -L /src/pnpm-lock.yaml

      # SBOM(CycloneDX) — 의존성 구성표를 생성해 아티팩트로 보관한다(보고용, 비차단).
      # pnpm 인식 생성기 cdxgen 을 dlx 로 실행(devDep 미추가).
      - name: Generate SBOM (CycloneDX)
        run: pnpm dlx @cyclonedx/cdxgen@12 -t pnpm -o bom.json
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: bom.json
          if-no-files-found: warn

  # Lighthouse — 빌드 산출물(dist)을 정적 서빙해 a11y/best-practices/seo(0.9) 게이트.
  # 성능(performance)은 환경 편차가 커 warn 으로만 둔다. 임계값 정본은 lighthouserc.json.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 데모 모드 빌드(MSW ON)를 정적 서빙해 감사한다 — 기본 빌드는 백엔드가 없어 페이지가 비므로.
      - name: Build (demo mode)
        run: pnpm build:demo

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun

  # E2E — Playwright 가 webServer 로 build:demo && preview 를 띄우고 시나리오를 검증한다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test
