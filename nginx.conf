server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 보안 헤더 — 문서 응답에 적용. CSP/보안 헤더의 프로덕션 정본(스펙 배경: ADR 0007).
  # CSP 는 실용 베이스라인이다.
  #  - style-src 'unsafe-inline': MUI/emotion 이 런타임에 <style> 을 주입하므로 허용(ADR 0007).
  #  - connect-src 'self': 통합 시 실제 API origin·Sentry ingest 를 추가한다(예: connect-src 'self' https://api.example.com).
  #  - frame-ancestors 'none' + X-Frame-Options DENY: 클릭재킹 차단(이중 방어).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # SPA: 모든 경로를 index.html 로 폴백 (클라이언트 라우팅)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 정적 에셋 캐싱 — 이 블록에 add_header 가 있으면 상위 보안 헤더는 상속되지 않으므로
  # 에셋에 유효한 nosniff 만 재선언한다(CSP/frame-ancestors 는 문서 응답 대상).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
