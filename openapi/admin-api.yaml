openapi: 3.0.3
info:
  title: Admin API
  version: 1.0.0
  description: >
    React Admin Template 의 목(MSW) API 를 기술한 샘플 스펙.
    orval 이 이 스펙에서 타입을 생성한다(src/shared/api/generated). 실제 백엔드를 연동하면
    이 스펙을 백엔드가 제공하는 OpenAPI 문서로 교체하세요.
servers:
  - url: http://localhost:3000
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 로그아웃
      responses:
        '204':
          description: 로그아웃 성공
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 현재 사용자 조회
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: 사용자 목록
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      tags: [users]
      summary: 사용자 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: 생성된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: 단일 사용자 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 단일 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    Role:
      type: string
      enum: [admin, manager, user]
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    CreateUserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
